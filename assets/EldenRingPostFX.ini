; EldenRingPostFX 1.0.0 - Restart the game after changes.
; true = remove this effect; false = preserve the incoming value.
; 修改后重启游戏。true 移除效果，false 保留游戏或其他 MOD 提供的值。
[postfx]
disable_chromatic_aberration = true
disable_vignette = true
disable_sharpening = true

; Diagnostic mode: count selected rows without modifying them.
; 诊断模式：只统计将修改的记录，不写入 GPARAM。
observe_only = false
